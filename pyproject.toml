[project]
name = "py-file-metadata-extractor"
version = "0.1.0"
description = "Get file details like size and timestamps for a path as a dict in one call."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
